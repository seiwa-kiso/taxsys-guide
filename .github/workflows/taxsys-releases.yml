name: TaxSys release guide sync
on:
  schedule:
    # Thursday 20:00 JST, Friday 08:00 JST fallback (UTC)
    - cron: '0 11 * * 4'
    - cron: '0 23 * * 4'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: taxsys-release-sync
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official release metadata
        run: python scripts/update_releases.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - name: Commit if changed
        run: |
          if git diff --quiet -- releases.json; then
            echo 'No change'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add releases.json
            git commit -m 'docs: sync official TaxSys release notes'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
